<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>傅里叶变换 · 圆上圆绘图</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2b;
    --line: #22304d;
    --text: #dbe6ff;
    --muted: #8b9bbd;
    --accent: #00e5ff;
    --accent2: #7c4dff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 16px 10px; gap: 14px;
    min-height: 100vh;
  }
  header { text-align: center; }
  header h1 {
    margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), #8fe9ff, var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 10px; width: 100%; max-width: 1100px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px;
  }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .group + .group { border-left: 1px solid var(--line); padding-left: 14px; margin-left: 4px; }
  .info {
    color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* 绘图（组合）工具栏 */
  .drawbar {
    display: none; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 8px; width: 100%; max-width: 1100px;
    background: linear-gradient(180deg, #17223c, var(--panel));
    border: 1px solid var(--accent2); border-radius: 14px; padding: 10px 14px;
  }
  .drawbar.show { display: flex; }
  .drawbar .group + .group { border-left: 1px solid var(--line); padding-left: 12px; margin-left: 2px; }
  .drawbar button { padding: 6px 10px; font-size: 12.5px; }
  .drawbar .chk {
    font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .drawbar .chk input { accent-color: var(--accent); }

  button {
    cursor: pointer; border: 1px solid var(--line); border-radius: 9px;
    background: #1a2438; color: var(--text); padding: 7px 12px; font-size: 13px;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.active {
    background: linear-gradient(135deg, rgba(0,229,255,.22), rgba(124,77,255,.22));
    border-color: var(--accent); color: #fff;
  }
  button.accent { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button.accent:hover { filter: brightness(1.1); }

  .sliders { display: flex; flex-wrap: wrap; gap: 16px; }
  .sliders label {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  }
  .sliders span { min-width: 42px; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 120px; accent-color: var(--accent); cursor: pointer; }
  .sliders input[type=number] {
    width: 66px; background: #1a2438; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px;
    font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .sliders input[type=number]:focus { outline: none; border-color: var(--accent); }

  .toggles label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .toggles input { accent-color: var(--accent); }
  select {
    background: #1a2438; color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 6px 8px; font-size: 13px; cursor: pointer;
  }
  select:hover { border-color: var(--accent); }
  select:focus { outline: none; border-color: var(--accent); }

  .stage { position: relative; width: 100%; max-width: 1100px; flex: 1 1 auto; display: flex; justify-content: center; }
  body.focus header, body.focus footer { display: none; }
  body.focus { padding: 8px 10px 6px; gap: 8px; }
  body.focus .controls { padding: 8px 12px; }
  canvas {
    width: 100%; height: 100%;
    display: block; border-radius: 16px;
    border: 1px solid var(--line);
    background: radial-gradient(700px 500px at 50% 50%, #101828 0%, #0a0f1c 75%);
    cursor: crosshair; touch-action: none;
  }
  .hint {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: rgba(10,15,28,.82); border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); padding: 8px 18px; font-size: 13px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .2s ease; max-width: 94%;
  }
  .hint.show { opacity: 1; }
  .toast {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    background: rgba(10,15,28,.9); border: 1px solid var(--accent2); border-radius: 10px;
    color: var(--text); padding: 8px 16px; font-size: 13px; max-width: 92%;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .toast.show { opacity: 1; }

  footer { color: var(--muted); font-size: 12px; text-align: center; max-width: 1100px; }
  footer a { color: var(--accent); text-decoration: none; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,8,16,.74); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 50;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 24px 30px; text-align: center; min-width: 300px; max-width: 92vw;
  }
  .card h3 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #overlayText { color: var(--text); font-size: 14px; margin-bottom: 14px; }
  .bar { height: 8px; background: #1a2438; border-radius: 999px; overflow: hidden; }
  #progressBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 999px; transition: width .1s ease;
  }
  #btnCancelRec { margin-top: 14px; display: none; }

  .field { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; text-align: left; }
  .field > span:first-child { width: 48px; text-align: right; color: var(--muted); flex-shrink: 0; }
  .field label { display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  .field input[type=radio] { accent-color: var(--accent); }
  .field select {
    background: #1a2438; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font-size: 13px; flex: 1;
  }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 14px; text-align: left; }
  .row { display: flex; gap: 10px; justify-content: flex-end; }
  .row button { padding: 8px 16px; }
</style>
</head>
<body>
  <header>
    <h1>傅里叶变换 · 圆上圆绘图</h1>
    <p>用许多个不停旋转的圆拼出图案 —— 每条独立线条由各自的一组圆绘制</p>
  </header>

  <div class="controls">
    <div class="group" id="presets">
      <button data-preset="heart" class="active">❤ 心形</button>
      <button data-preset="star">★ 五角星</button>
      <button data-preset="cardioid">♡ 心脏线</button>
      <button data-preset="rose5">✿ 玫瑰线·5瓣</button>
      <button data-preset="rose8">❁ 玫瑰线·8瓣</button>
      <button data-preset="deltoid">◮ 内摆线·三尖</button>
      <button data-preset="astroid">✦ 内摆线·四尖</button>
      <button data-preset="epicycloid">✧ 外摆线·三尖</button>
      <button data-preset="spiral">🌀 螺线</button>
      <button data-preset="lissajous">≈ 利萨茹</button>
      <button data-preset="infinity">∞ 无穷</button>
      <button data-preset="square">▢ 正方形</button>
      <button data-preset="triangle">△ 三角形</button>
      <button data-preset="pentagon">⬠ 五边形</button>
      <button data-preset="smiley">☺ 笑脸（多线）</button>
    </div>

    <div class="group">
      <button id="btnDraw" class="accent">✏️ 绘图 / 组合</button>
      <button id="btnUpload">🖼 上传图案</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <select id="recogMode" title="上传图片时的线条识别方式">
        <option value="auto" selected>识别：自动</option>
        <option value="contour">识别：轮廓（实心图案）</option>
        <option value="line">识别：线稿（中心线）</option>
      </select>
      <select id="detailSel" title="上传识别时保留的线条数量：越多越能还原发丝等细节">
        <option value="60">细节 标准</option>
        <option value="120" selected>细节 高</option>
        <option value="240">细节 极高</option>
        <option value="400">细节 极限</option>
      </select>
      <button id="btnSave">💾 保存作品</button>
      <button id="btnLoad">📂 载入作品</button>
      <input type="file" id="loadInput" accept=".json,application/json" hidden>
      <button id="btnExport">📤 导出</button>
      <button id="btnReplay">↻ 重新绘制</button>
      <button id="btnClear">🧹 清空轨迹</button>
      <button id="btnPlay">⏸ 暂停</button>
    </div>

    <div class="group sliders">
      <label>每条线的圆数
        <input type="range" id="circles" min="1" max="2048" step="1" value="40" title="拖动选择，最大 2048">
        <input type="number" id="circlesNum" min="1" max="2048" step="1" value="40" title="直接输入 1–2048">
      </label>
      <label>速度 <span id="speedLabel">1.0×</span>
        <input type="range" id="speed" min="0.2" max="5" step="0.1" value="1">
      </label>
    </div>

    <div class="group toggles">
      <label><input type="checkbox" id="showCircles" checked> 显示圆</label>
      <label><input type="checkbox" id="showLabels" checked> 标注</label>
      <label><input type="checkbox" id="showTrace" checked> 显示轨迹</label>
      <label><input type="checkbox" id="showPreview"> 线条预览</label>
      <span id="shapeInfo" class="info"></span>
    </div>

    <div class="group">
      <select id="aspectSel" title="画幅比例">
        <option value="auto">画幅 自适应</option>
        <option value="1:1">1:1 方形</option>
        <option value="4:3">4:3</option>
        <option value="3:4">3:4 竖版</option>
        <option value="16:9">16:9</option>
        <option value="9:16">9:16 竖版</option>
        <option value="2:1">2:1 宽幅</option>
      </select>
      <select id="widthSel" title="画幅最大宽度">
        <option value="1100">标准画幅</option>
        <option value="1600">宽画幅</option>
        <option value="2200">超宽画幅</option>
        <option value="3200">超宽+</option>
        <option value="0">全窗口</option>
      </select>
      <button id="btnZoomOut" title="缩小视图（滚轮也可）">−</button>
      <span id="zoomInfo" class="info" title="视图缩放比例">100%</span>
      <button id="btnZoomIn" title="放大视图（滚轮也可）">＋</button>
      <button id="btnZoomFit" title="适应画布，视图复位（滚轮双击亦可）">适应</button>
      <button id="btnFocus" title="专注模式：隐藏页头页脚，画布最大化（Esc 退出）">⛶ 专注</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="canvas"></canvas>
    <div id="hint" class="hint">拖动即可绘制；滚轮缩放、空格或中键拖动平移；Shift 等比、Alt 从中心</div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- 绘图（组合）工具栏：仅在绘图模式显示 -->
  <div class="drawbar" id="drawBar">
    <div class="group" id="tools">
      <button data-tool="select" title="点击选中；拖动移动；拖角上的方块缩放（Shift 等比 / Alt 以中心）">🖱 选择/移动</button>
      <button data-tool="free" class="active" title="自由画笔">✎ 画笔</button>
      <button data-tool="eraser" title="拖动擦除线条（可擦掉上传图案的部分线条）">⌫ 橡皮擦</button>
      <button data-tool="line" title="线段（Shift 锁定 45°）">╱ 线段</button>
      <button data-tool="arc" title="弧线">◜ 弧线</button>
      <button data-tool="wave" title="波浪线">〜 波浪</button>
      <button data-tool="spiral" title="螺线">🌀 螺线</button>
      <button data-tool="arrow" title="箭头（Shift 锁定 45°，末端大小可调）">→ 箭头</button>
      <button data-tool="darrow" title="双箭头">↔ 双箭头</button>
    </div>
    <div class="group" id="tools2">
      <button data-tool="rect" title="矩形（Shift 正方形）">▭ 矩形</button>
      <button data-tool="roundrect" title="圆角矩形">▢ 圆角矩形</button>
      <button data-tool="circle" title="正圆">◯ 圆</button>
      <button data-tool="ellipse" title="椭圆">⬭ 椭圆</button>
      <button data-tool="semicircle" title="半圆">◗ 半圆</button>
      <button data-tool="triangle" title="三角形">△ 三角</button>
      <button data-tool="diamond" title="菱形">◇ 菱形</button>
      <button data-tool="trapezoid" title="梯形">⏢ 梯形</button>
      <button data-tool="parallelogram" title="平行四边形">▱ 平行四边形</button>
      <button data-tool="pentagon" title="五边形">⬠ 五边形</button>
      <button data-tool="hexagon" title="六边形">⬡ 六边形</button>
      <button data-tool="star" title="五角星">★ 五角星</button>
      <button data-tool="star6" title="六角星">✶ 六角星</button>
      <button data-tool="cross" title="十字">✚ 十字</button>
      <button data-tool="heart" title="心形">❤ 心形</button>
      <button data-tool="crescent" title="月牙">☾ 月牙</button>
      <button data-tool="cloud" title="云朵">☁ 云朵</button>
    </div>
    <div class="group">
      <button id="btnRotL" title="逆时针旋转 15°（按住 Shift 为 5°）">↺ 逆时针</button>
      <button id="btnRotR" title="顺时针旋转 15°（按住 Shift 为 5°）">↻ 顺时针</button>
      <label class="chk">角度 <input type="range" id="rotAngle" min="-180" max="180" step="0.5" value="0" style="width:86px" title="拖动即旋转，松手归零"></label>
      <button id="btnPivotSel" title="旋转中心 = 选区中心">⌖ 选区中心</button>
      <button id="btnPivotCanvas" title="旋转中心 = 画布中心">⛶ 画布中心</button>
    </div>
    <div class="group">
      <label class="chk">箭头 <input type="range" id="arrowSize" min="0.4" max="3" step="0.1" value="1" style="width:70px"></label>
      <label class="chk">橡皮 <input type="range" id="eraserSize" min="6" max="44" step="2" value="16" style="width:70px"></label>
      <label class="chk"><input type="checkbox" id="snapGrid"> 网格吸附</label>
      <label class="chk"><input type="checkbox" id="showGrid"> 显示网格</label>
    </div>
    <div class="group">
      <button id="btnUndo" title="Ctrl+Z">↶ 撤销</button>
      <button id="btnRedo" title="Ctrl+Y">↷ 重做</button>
      <button id="btnSelAll" title="Ctrl+A">▣ 全选</button>
      <button id="btnDup" title="Ctrl+D">⧉ 复制</button>
      <button id="btnMirrorH" title="复制并关于画布中线左右镜像">⇋ 镜像复制</button>
      <button id="btnMirrorV" title="复制并关于画布中线上下镜像">⇵ 上下镜像</button>
      <button id="btnDelSel" title="Delete">🗑 删除选中</button>
      <button id="btnClearAll">清空全部</button>
    </div>
    <span id="drawInfo" class="info"></span>
  </div>

  <footer>
    灵感来自 B 站「漫士」《半小时速通傅里叶变换：千年的圆上圆游戏》 ·
    每条闭合线条独立做离散傅里叶变换，由各自的一组旋转圆绘制 ·
    支持 GIF / WebM 视频导出
  </footer>

  <!-- 导出对话框 -->
  <div id="exportOverlay" class="overlay">
    <div class="card">
      <h3>📤 导出设置</h3>
      <div class="field">
        <span>格式</span>
        <label><input type="radio" name="fmt" value="gif" checked> GIF 动图</label>
        <label><input type="radio" name="fmt" value="webm"> WebM 视频</label>
      </div>
      <div class="field">
        <span>清晰度</span>
        <select id="expRes"></select>
      </div>
      <div class="field">
        <span>帧率</span>
        <select id="expFps"></select>
      </div>
      <div class="note" id="expNote"></div>
      <div class="row">
        <button id="expCancel">取消</button>
        <button id="expStart" class="accent">开始导出</button>
      </div>
    </div>
  </div>

  <!-- 进度遮罩 -->
  <div id="overlay" class="overlay">
    <div class="card">
      <div class="spinner"></div>
      <div id="overlayText">正在生成 GIF…</div>
      <div class="bar"><div id="progressBar"></div></div>
      <button id="btnCancelRec">取消录制</button>
    </div>
  </div>

<script>
"use strict";

// ---------------- 基础元素 ----------------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const speedLabel = document.getElementById('speedLabel');
const shapeInfo = document.getElementById('shapeInfo');
const circlesInput = document.getElementById('circles');
const circlesNumInput = document.getElementById('circlesNum');
const btnDraw = document.getElementById('btnDraw');
const drawBar = document.getElementById('drawBar');
const drawInfo = document.getElementById('drawInfo');
const loadInput = document.getElementById('loadInput');
const toastEl = document.getElementById('toast');
const btnUpload = document.getElementById('btnUpload');
const btnExport = document.getElementById('btnExport');
const btnPlay = document.getElementById('btnPlay');
const fileInput = document.getElementById('fileInput');
const exportOverlay = document.getElementById('exportOverlay');
const expRes = document.getElementById('expRes');
const expFps = document.getElementById('expFps');
const expNote = document.getElementById('expNote');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const progressBar = document.getElementById('progressBar');
const btnCancelRec = document.getElementById('btnCancelRec');

let W = 0, H = 0, dpr = 1;

// 主视图：封装 ctx、尺寸与 世界坐标->屏幕坐标 的映射
const mainView = { ctx, W: 0, H: 0, cx: 0, cy: 0, scale: 1 };

const SAMPLE_N = 2048;         // 每条线条的均匀采样点数（= 每条线的傅里叶项数上限，最大 2048 个圆）
const LINE_SAMPLE_N = 1024;    // 线稿（中心线）模式每条线的采样点数（笔画简单，1024 项足够且快 4 倍）
const LOOP_SPEED = 0.12;       // 实时动画速度 1× 时每秒完成的圈数
const GIF_LOOP_SEC = 6;        // GIF / 视频一圈的时长（秒）
const HOLD_SEC = 0.6;          // 视频结尾停顿（秒）
const MAX_TOTAL_CIRCLES = 20000; // 所有线条圆数总上限（性能保护；按复杂度分配）
let maxContours = 120;         // 上传识别时保留的线条数上限（可调：越多样条越精细）
const EXTRACT_MAX = 1000;      // 上传图片处理时的最长边像素（越大越能留住细线条）
const LABEL_BUDGET = 60;       // 每帧最多绘制多少个频率标注

// ---------------- 状态 ----------------
// 每条线：{ coeffs, active, trail, hue }
let shapes = [];
let t = 0;
let playing = true;
let speed = 1;
let numCircles = 40;           // 每条线的圆数
let showCircles = true;
let showLabels = true;
let showTrace = true;

let drawing = false;
let recogMode = 'auto';        // 上传图片的线条识别方式：auto / contour / line

// ---------------- 绘图（组合）状态 ----------------
// 每个图形：{ paths: [[{x,y}, ...], ...], closed: bool }（坐标为主画布 CSS 像素）
let drawShapes = [];
let selectedShapes = [];       // 当前选中的图形（数组，支持多选）

let dragState = null;          // { mode:'create'|'move'|'free'|'erase', ... }
let freehand = [];             // 自由画笔正在画的轨迹
let eraserPos = null;          // 橡皮擦光标位置
let eraserSize = 16;           // 橡皮擦半径（px）
let arrowSize = 1;             // 箭头末端大小倍率（0.4–3）
let snapGrid = false;          // 是否吸附网格（默认关闭，拖动更跟手）
let showGrid = false;          // 是否显示网格
let canvasAspect = 'auto';     // 画幅比例：auto / 1:1 / 4:3 / 3:4 / 16:9 / 9:16 / 2:1
let wideWidth = 1100;          // 画幅最大宽度（px）
let focusMode = false;         // 专注模式：隐藏页头页脚，画布最大化
let pivot = null;              // 自定义旋转中心（null = 选区中心）
let rotBaseline = null;        // 角度滑块旋转时的基准快照
let viewZoom = 1;              // 视图缩放（1 = 适应画布）
let viewPanX = 0, viewPanY = 0;// 视图平移（CSS px）

let history = [], historyIdx = -1;
let currentPaths = [];         // 当前图形的原始路径（供「保存作品」）
let showPreview = false;       // 动画视图里是否显示「即将绘制的线条」
let previewCache = [];         // 线条预览的缓存（按图形与圆数变化重算）
const GRID = 20;               // 网格间距（px）

let videoMode = null;
let vid = null;

// ---------------- 预设图形（返回粗略闭合折线数组，稍后统一重采样） ----------------
function polygon(n, R = 1, rot = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + 2 * Math.PI * i / n;
    pts.push({ x: Math.cos(a) * R, y: Math.sin(a) * R });
  }
  return pts;
}
function starPolygon(n, R = 1, r = 0.5, rot = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < 2 * n; i++) {
    const a = rot + Math.PI * i / n;
    const rad = (i % 2 === 0) ? R : r;
    pts.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad });
  }
  return pts;
}
function parametric(N, fx, fy) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const th = 2 * Math.PI * i / N;
    pts.push({ x: fx(th), y: fy(th) });
  }
  return pts;
}
function circlePath(cx0, cy0, r, N = 160) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = 2 * Math.PI * i / N;
    pts.push({ x: cx0 + r * Math.cos(a), y: cy0 + r * Math.sin(a) });
  }
  return pts;
}
// 预设都以「多条线条」的形式给出（多数只有一条）
const PRESETS = {
  heart: () => [parametric(2048,
    th => 16 * Math.pow(Math.sin(th), 3),
    th => 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th))],
  star: () => [starPolygon(5, 1, 0.5)],
  cardioid: () => [parametric(2048,
    th => { const r = 1 + Math.cos(th); return r * Math.cos(th); },
    th => { const r = 1 + Math.cos(th); return r * Math.sin(th); })],
  rose5: () => [parametric(2048,
    th => { const r = Math.cos(5 * th); return r * Math.cos(th); },
    th => { const r = Math.cos(5 * th); return r * Math.sin(th); })],
  rose8: () => [parametric(2048,
    th => { const r = Math.cos(4 * th); return r * Math.cos(th); },
    th => { const r = Math.cos(4 * th); return r * Math.sin(th); })],
  deltoid: () => [parametric(2048,
    th => 2 * Math.cos(th) + Math.cos(2 * th),
    th => 2 * Math.sin(th) - Math.sin(2 * th))],
  astroid: () => [parametric(2048,
    th => 3 * Math.cos(th) + Math.cos(3 * th),
    th => 3 * Math.sin(th) - Math.sin(3 * th))],
  epicycloid: () => [parametric(2048,
    th => 4 * Math.cos(th) - Math.cos(4 * th),
    th => 4 * Math.sin(th) - Math.sin(4 * th))],
  spiral: () => {
    const pts = [], N = 1200, turns = 2.5;
    const add = (s) => {
      const th = 2 * Math.PI * turns * s;
      const r = 0.05 + 0.95 * s;
      pts.push({ x: Math.cos(th) * r, y: Math.sin(th) * r });
    };
    for (let i = 0; i < N; i++) add(i / (N - 1));
    for (let i = N - 1; i >= 0; i--) add(i / (N - 1));
    return [pts];
  },
  lissajous: () => [parametric(2048, th => Math.sin(3 * th), th => Math.cos(5 * th))],
  infinity: () => [parametric(2048,
    th => Math.cos(th) / (1 + Math.sin(th) * Math.sin(th)),
    th => Math.sin(th) * Math.cos(th) / (1 + Math.sin(th) * Math.sin(th)))],
  square: () => [polygon(4, 1)],
  triangle: () => [polygon(3, 1)],
  pentagon: () => [polygon(5, 1)],
  // 演示「多条独立线条」：脸 + 两只眼 + 嘴
  smiley: () => {
    const face = circlePath(0, 0, 1, 220);
    const leftEye = circlePath(-0.36, -0.28, 0.13, 90);
    const rightEye = circlePath(0.36, -0.28, 0.13, 90);
    const mouth = [];
    for (let i = 0; i <= 60; i++) {           // 笑脸嘴：一段圆弧，闭合后成为月牙
      const a = Math.PI * 0.18 + (Math.PI * 0.64) * (i / 60);
      mouth.push({ x: 0.62 * Math.cos(a), y: 0.30 + 0.42 * Math.sin(a) });
    }
    return [face, leftEye, rightEye, mouth];
  }
};

// ---------------- 几何处理 ----------------
function pathLength(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  return L;
}
function resampleClosed(points, N) {
  const pts = points.concat([points[0]]);
  const segLens = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const d = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
    segLens.push(d); total += d;
  }
  if (total === 0) return null;
  const out = [];
  for (let j = 0; j < N; j++) {
    const target = total * j / N;
    let acc = 0;
    for (let i = 0; i < segLens.length; i++) {
      if (acc + segLens[i] >= target || i === segLens.length - 1) {
        const f = (target - acc) / (segLens[i] || 1);
        out.push({
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * f,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * f
        });
        break;
      }
      acc += segLens[i];
    }
  }
  return out;
}

// ---------------- 傅里叶变换 ----------------
// z_k = x_k + i·y_k，c_n = (1/N) Σ z_k·e^{-2πi nk/N}
function computeDFT(points) {
  const N = points.length;
  const lo = -Math.floor(N / 2);
  const hi = Math.floor((N - 1) / 2);
  const coeffs = [];
  for (let n = lo; n <= hi; n++) {
    let re = 0, im = 0;
    for (let k = 0; k < N; k++) {
      const th = 2 * Math.PI * n * k / N;
      const c = Math.cos(th), s = Math.sin(th);
      const x = points[k].x, y = points[k].y;
      re += x * c + y * s;
      im += y * c - x * s;
    }
    re /= N; im /= N;
    coeffs.push({ n, re, im, amp: Math.hypot(re, im), phase: Math.atan2(im, re) });
  }
  coeffs.sort((a, b) => b.amp - a.amp);
  return coeffs;
}

// 载入多条闭合线条：重采样 -> 共同归一化 -> 每条各自做 DFT
// 关键：所有线条共用同一中心与缩放，否则相对位置与大小会被破坏；
// 各条的直流项(n=0)会自然充当平移圆，把该组圆移到正确位置。
function setShapes(rawPaths, sampleN = SAMPLE_N) {
  const items = [];
  let cost = 0;
  for (const raw of rawPaths) {
    const pts = Array.isArray(raw) ? raw : (raw && raw.pts);
    if (!pts || pts.length < 3) continue;
    // 采样点数按弧长自适应：细节不可能超过像素数，
    // 短笔画少采样能大幅降低 DFT 开销，从而支撑上百条线条
    const cap = Array.isArray(raw) ? sampleN : (raw.sampleN || sampleN);
    const factor = Array.isArray(raw) ? 1.0 : 0.7;
    const n = Math.max(48, Math.min(cap, Math.round(pathLength(pts) * factor)));
    items.push({ pts, n });
    cost += n * n;                                   // DFT 是 O(N²)
  }
  // 总开销保护：线条极多且很长时整体降采样，避免载入要等好几秒
  const COST_LIMIT = 30e6;
  if (cost > COST_LIMIT) {
    const k = Math.sqrt(COST_LIMIT / cost);
    for (const it of items) it.n = Math.max(32, Math.round(it.n * k));
  }
  const resampled = [];
  const kept = [];
  for (const it of items) {
    const u = resampleClosed(it.pts, it.n);
    if (u) { resampled.push(u); kept.push(it.pts); }
  }
  currentPaths = kept.map(pa => pa.map(q => ({ x: q.x, y: q.y })));
  if (!resampled.length) return;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const pts of resampled) {
    for (const p of pts) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }
  }
  const ccx = (minX + maxX) / 2, ccy = (minY + maxY) / 2;
  const s = Math.max(maxX - minX, maxY - minY) || 1;

  shapes = resampled.map((pts, i) => ({
    coeffs: computeDFT(pts.map(p => ({ x: (p.x - ccx) / s * 2, y: (p.y - ccy) / s * 2 }))),
    active: [],
    trail: [],
    hue: (190 + i * 57) % 360
  }));
  applyCircleCount();
  t = 0; playing = true;
  updatePlayBtn();
}

function clearTrails() { for (const s of shapes) s.trail = []; }

// 估计「要还原到 98.5% 能量」需要多少个系数 —— 作为圆数分配的依据
// 注意：只统计交流分量（n≠0）。直流项只是把整组圆平移到正确位置，
// 它的能量往往占 99%+，若计入会让所有图形都被误判成「很少圆就够」。
function neededCount(coeffs, frac = 0.985) {
  let total = 0, dc = 0;
  for (let i = 0; i < coeffs.length; i++) {
    const e = coeffs[i].amp * coeffs[i].amp;
    total += e;
    if (coeffs[i].n === 0) dc = e;
  }
  const ac = total - dc;
  if (!(ac > 0)) return 4;
  let acc = 0, k = 0;
  for (let i = 0; i < coeffs.length; i++) {
    if (coeffs[i].n === 0) continue;
    acc += coeffs[i].amp * coeffs[i].amp;
    k++;
    if (acc >= ac * frac) return Math.max(4, k + 1);      // +1 留给直流平移项
  }
  return coeffs.length;
}

// 圆数按「复杂度」分配：简单笔画少给、复杂轮廓多给，而不是平均分配
// （平均分配会让发丝和五官都画不好）；并把预算尽量用满
function applyCircleCount() {
  if (!shapes.length) { updateShapeInfo(); rebuildPreview(); return; }
  const budget = Math.max(shapes.length * 4, Math.min(MAX_TOTAL_CIRCLES, numCircles * shapes.length));
  const cap = shapes.map(s => s.coeffs.length);
  const alloc = shapes.map(() => 4);
  let remaining = budget - shapes.length * 4;
  let open = shapes.map((_, i) => i);
  for (let pass = 0; pass < 6 && remaining > 0 && open.length; pass++) {
    let wsum = 0;
    for (const i of open) {
      if (shapes[i].need === undefined) shapes[i].need = neededCount(shapes[i].coeffs);
      wsum += shapes[i].need;
    }
    if (wsum <= 0) break;
    let used = 0;
    for (const i of open) {
      const add = Math.min(Math.floor(remaining * shapes[i].need / wsum), cap[i] - alloc[i]);
      if (add > 0) { alloc[i] += add; used += add; }
    }
    remaining -= used;
    if (!used) break;
    open = open.filter(i => alloc[i] < cap[i]);          // 已满的不再参与
  }
  let total = 0;
  shapes.forEach((s, i) => {
    s.active = s.coeffs.slice(0, Math.min(alloc[i], cap[i]));
    total += s.active.length;
  });
  updateShapeInfo(total);
  rebuildPreview();
}

function updateShapeInfo(totalIn) {
  if (!shapes.length) { shapeInfo.textContent = ''; return; }
  const total = totalIn !== undefined ? totalIn : shapes.reduce((a, s) => a + s.active.length, 0);
  const many = shapes.length > 1 ? '（按复杂度分配）' : '';
  shapeInfo.textContent = `${shapes.length} 条线 · 共 ${total} 个圆${many}`;
}

// ---------------- 动画计算 ----------------
// 叠加一组系数对应的旋转矢量：返回各圆圆心/半径/角度与笔尖
function computeArms(active, t) {
  const arms = [];
  let px = 0, py = 0;
  for (const c of active) {
    const angle = c.phase + 2 * Math.PI * c.n * t;
    arms.push({ x: px, y: py, r: c.amp, angle, n: c.n });
    px += c.amp * Math.cos(angle);
    py += c.amp * Math.sin(angle);
  }
  return { arms, tip: { x: px, y: py } };
}

// 预计算某组圆一整圈的笔尖路径（供导出按相位截取轨迹）
function computeFullPath(active, F) {
  const path = [];
  for (let i = 0; i <= F; i++) path.push(computeArms(active, i / F).tip);
  return path;
}

// ---------------- 渲染 ----------------
function toScreen(view, p) { return { x: p.x * view.scale + view.cx, y: p.y * view.scale + view.cy }; }

function drawTrace(view, pts, hue) {
  if (pts.length < 2) return;
  const g = view.ctx;
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = `hsla(${hue}, 95%, 62%, 0.92)`;
  g.shadowColor = `hsla(${hue}, 95%, 62%, 0.85)`;
  g.lineWidth = 2;
  g.shadowBlur = 7;
  g.beginPath();
  const s0 = toScreen(view, pts[0]);
  g.moveTo(s0.x, s0.y);
  for (let i = 1; i < pts.length; i++) {
    const s = toScreen(view, pts[i]);
    g.lineTo(s.x, s.y);
  }
  g.stroke();
  g.restore();
}

function drawArms(view, arms, hueBase, labelBudget) {
  const g = view.ctx;
  g.save();
  g.lineWidth = 1;
  for (let i = 0; i < arms.length; i++) {
    const a = arms[i];
    const r = a.r * view.scale;
    if (r < 0.5) continue;              // 半径不足半像素、根本看不见的圆跳过（圆数量大时的性能关键）
    const c = toScreen(view, { x: a.x, y: a.y });
    const hue = (hueBase + i * 3) % 360;

    g.beginPath();
    g.arc(c.x, c.y, r, 0, 2 * Math.PI);
    g.strokeStyle = `hsla(${hue}, 85%, 68%, 0.30)`;
    g.stroke();

    const tip = toScreen(view, { x: a.x + a.r * Math.cos(a.angle), y: a.y + a.r * Math.sin(a.angle) });
    g.beginPath();
    g.moveTo(c.x, c.y);
    g.lineTo(tip.x, tip.y);
    g.strokeStyle = `hsla(${hue}, 85%, 62%, 0.72)`;
    g.stroke();

    if (r >= 3) {                       // 小圆不必画圆心点
      g.beginPath();
      g.arc(c.x, c.y, 1.4, 0, 2 * Math.PI);
      g.fillStyle = `hsla(${hue}, 85%, 72%, 0.9)`;
      g.fill();
    }

    if (showLabels && labelBudget && labelBudget.n > 0 && r >= 7 && i < 48) {
      labelBudget.n--;
      g.font = '9px ui-monospace, Consolas, monospace';
      g.textAlign = 'left';
      g.textBaseline = 'bottom';
      g.fillStyle = `hsla(${hue}, 85%, 78%, 0.9)`;
      g.fillText(`n:${a.n}  r:${a.r.toFixed(2)}`, c.x + 5, c.y - 4);
    }
  }
  g.restore();
}

function drawTip(view, tip, hue) {
  const g = view.ctx;
  const s = toScreen(view, tip);
  g.save();
  g.fillStyle = '#ffffff';
  g.shadowColor = `hsla(${hue}, 95%, 70%, 1)`;
  g.shadowBlur = 12;
  g.beginPath();
  g.arc(s.x, s.y, 3, 0, 2 * Math.PI);
  g.fill();
  g.restore();
}

function drawOrigin(view) {
  const g = view.ctx;
  g.fillStyle = 'rgba(255,255,255,0.5)';
  g.beginPath();
  g.arc(view.cx, view.cy, 2, 0, 2 * Math.PI);
  g.fill();
}

// 线条预览：把当前圆数下「即将由圆画出的路径」淡淡地铺在底层
function rebuildPreview() {
  previewCache = shapes.length ? shapes.map(s => computeFullPath(s.active, 300)) : [];
}
function drawPreviewPath(view, pts, hue) {
  if (!pts || pts.length < 2) return;
  const g = view.ctx;
  g.save();
  g.strokeStyle = `hsla(${hue}, 85%, 66%, 0.30)`;
  g.lineWidth = 1.2;
  g.beginPath();
  const s0 = toScreen(view, pts[0]);
  g.moveTo(s0.x, s0.y);
  for (let i = 1; i < pts.length; i++) {
    const s = toScreen(view, pts[i]);
    g.lineTo(s.x, s.y);
  }
  g.stroke();
  g.restore();
}
function drawPreviews(view) {
  for (let i = 0; i < previewCache.length && i < shapes.length; i++) {
    drawPreviewPath(view, previewCache[i], shapes[i].hue);
  }
}

function strokePath(g, path, closed) {
  if (!path || path.length < 2) return;
  g.beginPath();
  g.moveTo(path[0].x, path[0].y);
  for (let i = 1; i < path.length; i++) g.lineTo(path[i].x, path[i].y);
  if (closed) g.closePath();
  g.stroke();
}

// 绘图模式的画面：网格 + 已放置图形 + 正在绘制/拖动的预览
function drawDrawMode(view) {
  const g = view.ctx;
  if (showGrid) {
    g.save();
    g.strokeStyle = 'rgba(90,125,180,0.22)';
    g.lineWidth = 1;
    g.beginPath();
    for (let x = 0; x <= view.W; x += GRID) { g.moveTo(x, 0); g.lineTo(x, view.H); }
    for (let y = 0; y <= view.H; y += GRID) { g.moveTo(0, y); g.lineTo(view.W, y); }
    g.stroke();
    g.restore();
  }
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const s of drawShapes) {
    const sel = (selectedShapes.indexOf(s) >= 0);
    g.strokeStyle = sel ? '#ffd166' : 'rgba(150,175,215,0.85)';
    g.lineWidth = sel ? 2.5 : 2;
    g.shadowColor = sel ? 'rgba(255,209,102,0.8)' : 'transparent';
    g.shadowBlur = sel ? 6 : 0;
    for (const path of s.paths) strokePath(g, path, s.closed);
  }
  g.restore();

  // 选中图形：描边高亮 + 缩放框与四角手柄
  if (selectedShapes.length) {
    const bb = selectionBBox();
    if (bb) {
      g.save();
      g.setLineDash([6, 5]);
      g.strokeStyle = 'rgba(255,209,102,0.75)';
      g.lineWidth = 1.2;
      g.strokeRect(bb.x0 - 6, bb.y0 - 6, bb.x1 - bb.x0 + 12, bb.y1 - bb.y0 + 12);
      g.setLineDash([]);
      g.fillStyle = '#ffd166';
      g.strokeStyle = 'rgba(40,30,10,0.9)';
      g.lineWidth = 1;
      for (const [hx, hy] of [[bb.x0, bb.y0], [bb.x1, bb.y0], [bb.x0, bb.y1], [bb.x1, bb.y1]]) {
        g.beginPath();
        g.rect(hx - 5, hy - 5, 10, 10);
        g.fill();
        g.stroke();
      }
      g.restore();

      // 旋转手柄（四角外侧圆点）与旋转中心准星
      const hs = rotationHandles();
      const corners = [[bb.x0, bb.y0], [bb.x1, bb.y0], [bb.x0, bb.y1], [bb.x1, bb.y1]];
      g.save();
      g.strokeStyle = 'rgba(124,77,255,0.38)';
      g.setLineDash([3, 3]);
      g.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.moveTo(corners[i][0], corners[i][1]);
        g.lineTo(hs[i][0], hs[i][1]);
        g.stroke();
      }
      g.setLineDash([]);
      g.fillStyle = 'rgba(124,77,255,0.5)';
      g.strokeStyle = 'rgba(195,170,255,0.95)';
      g.lineWidth = 1.4;
      for (const [hx, hy] of hs) {
        g.beginPath();
        g.arc(hx, hy, 5.5, 0, Math.PI * 2);
        g.fill();
        g.stroke();
      }
      const pv = currentPivot();
      g.strokeStyle = '#ff8a5c';
      g.lineWidth = 1.6;
      g.beginPath();
      g.arc(pv.x, pv.y, 8, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.moveTo(pv.x - 13, pv.y); g.lineTo(pv.x + 13, pv.y);
      g.moveTo(pv.x, pv.y - 13); g.lineTo(pv.x, pv.y + 13);
      g.stroke();
      g.restore();

      if (dragState && (dragState.mode === 'scale' || dragState.mode === 'rotate')) {
        const label = dragState.mode === 'rotate'
          ? `旋转 ${(dragState.ang * 180 / Math.PI).toFixed(1)}°`
          : `${Math.round((bb.x1 - bb.x0))} × ${Math.round((bb.y1 - bb.y0))} · ${Math.round(dragState.sx * 100)}%`;
        g.save();
        g.font = '12px ui-monospace, Consolas, monospace';
        g.fillStyle = 'rgba(255,255,255,0.92)';
        g.textAlign = 'left'; g.textBaseline = 'top';
        g.fillText(label, bb.x1 + 40, bb.y1 + 10);
        g.restore();
      }
    }
  }

  // 橡皮擦光标
  if (currentTool === 'eraser' && eraserPos) {
    g.save();
    g.beginPath();
    g.arc(eraserPos.x, eraserPos.y, eraserSize, 0, 2 * Math.PI);
    g.strokeStyle = 'rgba(255,120,150,0.9)';
    g.lineWidth = 1.5;
    g.stroke();
    g.fillStyle = 'rgba(255,120,150,0.12)';
    g.fill();
    g.restore();
  }

  // 正在创建的图形预览
  if (dragState && dragState.mode === 'create') {
    const built = buildShape(currentTool, dragState.a, dragState.b, dragState.shift, dragState.alt);
    if (built) {
      g.save();
      g.strokeStyle = 'rgba(255,255,255,0.95)';
      g.lineWidth = 2.5;
      g.lineJoin = 'round'; g.lineCap = 'round';
      g.shadowColor = 'rgba(255,255,255,0.5)'; g.shadowBlur = 4;
      for (const path of built.paths) strokePath(g, path, built.closed);
      g.restore();
      const dx = dragState.b.x - dragState.a.x, dy = dragState.b.y - dragState.a.y;
      const isLine = (currentTool === 'line' || currentTool === 'arrow' || currentTool === 'darrow');
      const label = isLine
        ? `长 ${Math.round(Math.hypot(dx, dy))} · ${Math.round(-Math.atan2(dy, dx) * 180 / Math.PI)}°`
        : `${Math.round(Math.abs(dx))} × ${Math.round(Math.abs(dy))}`;
      g.save();
      g.font = '12px ui-monospace, Consolas, monospace';
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.textAlign = 'left'; g.textBaseline = 'top';
      g.fillText(label, dragState.b.x + 12, dragState.b.y + 12);
      g.restore();
    }
  }
  // 自由画笔正在画的轨迹
  if (freehand.length >= 2) {
    g.save();
    g.strokeStyle = 'rgba(255,255,255,0.95)';
    g.lineWidth = 2.5;
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.shadowColor = 'rgba(255,255,255,0.5)'; g.shadowBlur = 4;
    strokePath(g, freehand, false);
    g.restore();
  }
}

// 把多条线在相位 tt 的一帧画到任意 view 上（traces 为空时用实时轨迹）
function paintShapes(view, tt, traces) {
  const labelBudget = { n: LABEL_BUDGET };
  if (showPreview) drawPreviews(view);
  for (let i = 0; i < shapes.length; i++) {
    const s = shapes[i];
    drawTrace(view, traces ? traces[i] : s.trail, s.hue);
    const { arms, tip } = computeArms(s.active, tt);
    if (showCircles) drawArms(view, arms, s.hue, labelBudget);
    drawTip(view, tip, s.hue);
  }
  drawOrigin(view);
}

// ---------------- 主循环 ----------------
let last = performance.now();
let frameCount = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const g = mainView.ctx;

  if (videoMode) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);        // 导出不受视图缩放影响
    const el = (now - videoMode.startTime) / 1000;
    const tt = Math.min(el / GIF_LOOP_SEC, 1);
    const idx = Math.round(tt * videoMode.F);
    g.fillStyle = '#0d1322';
    g.fillRect(0, 0, mainView.W, mainView.H);
    paintShapes(mainView, tt, videoMode.fullPaths.map(fp => fp.slice(0, idx + 1)));
    if (el > GIF_LOOP_SEC + HOLD_SEC && vid) vid.rec.stop();
    return;
  }

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  applyViewTransform(g);                          // 之后所有绘制都在「基准坐标」下进行

  if (drawing) { drawDrawMode(mainView); return; }
  if (!shapes.length) return;

  if (playing) {
    t += dt * speed * LOOP_SPEED;
    if (t >= 1) { t -= 1; clearTrails(); }
  }

  const labelBudget = { n: LABEL_BUDGET };
  if (showPreview) drawPreviews(mainView);
  // 线条很多时轨迹隔帧取样，把每帧折线点数控制在可流畅绘制的范围
  const trailStep = shapes.length > 60 ? 2 : 1;
  frameCount++;
  const pushTrail = (frameCount % trailStep) === 0;
  for (const s of shapes) {
    const { arms, tip } = computeArms(s.active, t);
    if (playing && pushTrail) s.trail.push(tip);
    if (showTrace) drawTrace(mainView, s.trail, s.hue);
    if (showCircles) drawArms(mainView, arms, s.hue, labelBudget);
    drawTip(mainView, tip, s.hue);
  }
  drawOrigin(mainView);
}

// ---------------- 尺寸自适应 ----------------
function resize() {
  if (videoMode) return;                        // 录制期间尺寸由导出逻辑接管
  const stage = canvas.parentElement;
  const controls = document.querySelector('.controls');
  dpr = window.devicePixelRatio || 1;

  // 画幅宽度：多档，0 表示跟随窗口；且不超过窗口可用宽度
  const box = focusMode ? 28 : 44;
  const maxW = Math.max(360, Math.min(wideWidth > 0 ? wideWidth : 1e5, window.innerWidth - box));
  controls.style.maxWidth = maxW + 'px';
  drawBar.style.maxWidth = maxW + 'px';
  stage.style.maxWidth = maxW + 'px';
  const rect = stage.getBoundingClientRect();
  let cw = Math.max(320, rect.width);

  // 可用高度 = 视口高度 - 工具栏 / 页头页脚占位
  let chrome = controls.offsetHeight + 64;
  if (drawing && drawBar.classList.contains('show')) chrome += drawBar.offsetHeight + 10;
  if (!focusMode) {
    const hd = document.querySelector('header'), ft = document.querySelector('footer');
    chrome += (hd ? hd.offsetHeight : 0) + (ft ? ft.offsetHeight : 0) + 34;
  }
  const availH = Math.max(300, window.innerHeight - chrome);

  let ch;
  if (canvasAspect === 'auto') {
    ch = Math.max(320, Math.min(availH, cw * 0.62));
  } else {
    const [aw, ah] = canvasAspect.split(':').map(Number);
    ch = cw * ah / aw;
    if (ch > availH) { ch = availH; cw = ch * aw / ah; }   // 高度受限 → 反过来收窄宽度
    if (ch < 240) { ch = 240; cw = ch * aw / ah; }
  }
  W = Math.round(cw);
  H = Math.round(ch);
  stage.style.height = H + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  Object.assign(mainView, { W, H, cx: W / 2, cy: H / 2, scale: Math.min(W, H) * 0.30 });
}

document.getElementById('aspectSel').addEventListener('change', (e) => {
  canvasAspect = e.target.value;
  resize();
});
document.getElementById('widthSel').addEventListener('change', (e) => {
  wideWidth = parseInt(e.target.value, 10);
  resize();
});

// ---------------- 视图缩放 / 平移 ----------------
// 所有绘制仍用「基准坐标」（= 适应画布的 CSS 像素），由画布变换实现缩放平移
function applyViewTransform(g) {
  const z = viewZoom;
  g.setTransform(dpr * z, 0, 0, dpr * z,
    dpr * (mainView.cx + viewPanX - z * mainView.cx),
    dpr * (mainView.cy + viewPanY - z * mainView.cy));
}
function screenToBase(p) {                      // 屏幕坐标 → 基准坐标（供指针输入）
  return {
    x: (p.x - mainView.cx - viewPanX) / viewZoom + mainView.cx,
    y: (p.y - mainView.cy - viewPanY) / viewZoom + mainView.cy
  };
}
function updateZoomLabel() {
  const el = document.getElementById('zoomInfo');
  if (el) el.textContent = Math.round(viewZoom * 100) + '%';
}
function zoomAt(screenPt, factor) {             // 以某点为锚缩放（保持该点不动）
  const before = screenToBase(screenPt);
  viewZoom = Math.max(0.2, Math.min(10, viewZoom * factor));
  const after = screenToBase(screenPt);
  viewPanX += (after.x - before.x) * viewZoom;
  viewPanY += (after.y - before.y) * viewZoom;
  updateZoomLabel();
}
function resetView() {
  viewZoom = 1; viewPanX = 0; viewPanY = 0;
  updateZoomLabel();
}
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (videoMode) return;
  zoomAt({ x: e.offsetX, y: e.offsetY }, Math.exp(-e.deltaY * 0.0016));
}, { passive: false });
canvas.addEventListener('dblclick', () => { if (!drawing) resetView(); });
document.getElementById('btnZoomIn').addEventListener('click', () =>
  zoomAt({ x: mainView.cx + viewPanX, y: mainView.cy + viewPanY }, 1.25));
document.getElementById('btnZoomOut').addEventListener('click', () =>
  zoomAt({ x: mainView.cx + viewPanX, y: mainView.cy + viewPanY }, 0.8));
document.getElementById('btnZoomFit').addEventListener('click', resetView);
document.getElementById('btnFocus').addEventListener('click', () => {
  focusMode = !focusMode;
  document.body.classList.toggle('focus', focusMode);
  document.getElementById('btnFocus').textContent = focusMode ? '⛶ 退出专注' : '⛶ 专注';
  resize();
  showToast(focusMode ? '专注模式：画布已最大化，按 Esc 退出' : '已退出专注模式', 2400);
});

// ---------------- 交互 ----------------
function updatePlayBtn() { btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放'; }

// ============================================================
//  绘图（组合）模式：基础几何图形 + 选择/移动/镜像/撤销
// ============================================================
function snapPt(p) {
  if (!snapGrid) return { x: p.x, y: p.y };
  return { x: Math.round(p.x / GRID) * GRID, y: Math.round(p.y / GRID) * GRID };
}
function sampleLine(a, b, n = 32) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  return out;
}
function ellipsePath(cx, cy, rx, ry, n = 96) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2;
    out.push({ x: cx + rx * Math.cos(t), y: cy + ry * Math.sin(t) });
  }
  return out;
}
function polygonPath(cx, cy, rx, ry, n, rot = -Math.PI / 2) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = rot + i / n * Math.PI * 2;
    out.push({ x: cx + rx * Math.cos(t), y: cy + ry * Math.sin(t) });
  }
  return out;
}
function starPath(cx, cy, rx, ry, points = 5, inner = 0.42, rot = -Math.PI / 2) {
  const out = [];
  for (let i = 0; i < points * 2; i++) {
    const t = rot + i * Math.PI / points;
    const k = (i % 2 === 0) ? 1 : inner;
    out.push({ x: cx + rx * k * Math.cos(t), y: cy + ry * k * Math.sin(t) });
  }
  return out;
}
function heartPath(cx, cy, rx, ry, n = 140) {
  const raw = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2;
    raw.push({                                   // 屏幕坐标 y 向下，故取负
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
    });
  }
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  for (const p of raw) {
    mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x);
    mny = Math.min(mny, p.y); mxy = Math.max(mxy, p.y);
  }
  const ox = (mxx + mnx) / 2, oy = (mxy + mny) / 2;
  const sx = (mxx - mnx) / 2 || 1, sy = (mxy - mny) / 2 || 1;
  return raw.map(p => ({ x: cx + (p.x - ox) / sx * rx, y: cy + (p.y - oy) / sy * ry }));
}
function constrain45(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const step = Math.PI / 4;
  const ang = Math.round(Math.atan2(dy, dx) / step) * step;
  const len = Math.hypot(dx, dy);
  return { x: a.x + len * Math.cos(ang), y: a.y + len * Math.sin(ang) };
}
function openToClosed(path) {                    // 开放笔画 → 去程 + 回程，构成闭合曲线
  const out = path.slice();
  for (let i = path.length - 2; i > 0; i--) out.push(path[i]);
  return out;
}

function roundRectPath(x0, y0, x1, y1, r, n = 8) {
  r = Math.max(0, Math.min(r, (x1 - x0) / 2, (y1 - y0) / 2));
  const out = [];
  const corners = [
    [x1 - r, y0 + r, -Math.PI / 2, 0],
    [x1 - r, y1 - r, 0, Math.PI / 2],
    [x0 + r, y1 - r, Math.PI / 2, Math.PI],
    [x0 + r, y0 + r, Math.PI, Math.PI * 1.5]
  ];
  for (const [ccx, ccy, a0, a1] of corners) {
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1 - a0) * i / n;
      out.push({ x: ccx + r * Math.cos(a), y: ccy + r * Math.sin(a) });
    }
  }
  return out;
}
function crossPath(x0, y0, x1, y1, arm = 0.34) {
  const w = x1 - x0, h = y1 - y0;
  const ax = w * arm / 2, ay = h * arm / 2;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return [
    { x: cx - ax, y: y0 }, { x: cx + ax, y: y0 },
    { x: cx + ax, y: cy - ay }, { x: x1, y: cy - ay },
    { x: x1, y: cy + ay }, { x: cx + ax, y: cy + ay },
    { x: cx + ax, y: y1 }, { x: cx - ax, y: y1 },
    { x: cx - ax, y: cy + ay }, { x: x0, y: cy + ay },
    { x: x0, y: cy - ay }, { x: cx - ax, y: cy - ay }
  ];
}
// 月牙：两条共享端点的弧，保证严格闭合
function crescentPath(cx, cy, rx, ry, n = 90) {
  const p1 = { x: cx - rx * 0.62, y: cy - ry * 0.98 };
  const p2 = { x: cx - rx * 0.62, y: cy + ry * 0.98 };
  const bulge = (a, b, amount) => {
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      out.push({
        x: a.x + (b.x - a.x) * t + Math.sin(Math.PI * t) * amount,
        y: a.y + (b.y - a.y) * t
      });
    }
    return out;
  };
  return bulge(p1, p2, rx * 1.62).concat(bulge(p2, p1, rx * 0.92));
}
// 云朵：一排圆的并集，从中心向各方向取最远交点
function cloudPath(cx, cy, rx, ry, n = 180) {
  const bumps = [
    { x: -0.62, y: 0.20, r: 0.40 }, { x: -0.22, y: -0.14, r: 0.52 },
    { x: 0.24, y: -0.08, r: 0.46 }, { x: 0.62, y: 0.20, r: 0.36 },
    { x: 0.10, y: 0.36, r: 0.42 }, { x: -0.35, y: 0.40, r: 0.34 }
  ];
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 - Math.PI / 2;
    const ux = Math.cos(a), uy = Math.sin(a);
    let best = Math.min(rx, ry) * 0.12;
    for (const bp of bumps) {
      const bx = cx + bp.x * rx, by = cy + bp.y * ry, r = bp.r * Math.min(rx, ry) * 1.35;
      const dx = bx - cx, dy = by - cy;
      const proj = dx * ux + dy * uy;
      const h2 = r * r - (dx * dx + dy * dy - proj * proj);
      if (h2 < 0) continue;
      const t = proj + Math.sqrt(h2);
      if (t > best) best = t;
    }
    out.push({ x: cx + ux * best, y: cy + uy * best });
  }
  return out;
}

// 把点集归一化到指定矩形内（保证图形不超出拖拽框）
function fitToBox(pts, x0, y0, x1, y1) {
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  for (const p of pts) {
    if (p.x < mnx) mnx = p.x; if (p.x > mxx) mxx = p.x;
    if (p.y < mny) mny = p.y; if (p.y > mxy) mxy = p.y;
  }
  const sx = (mxx - mnx) || 1, sy = (mxy - mny) || 1;
  return pts.map(p => ({
    x: x0 + (p.x - mnx) / sx * (x1 - x0),
    y: y0 + (p.y - mny) / sy * (y1 - y0)
  }));
}

// 由拖拽的两个点生成图形（内部实现）
function buildShapeRaw(tool, a, b, shift, alt) {
  let x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
  let y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
  if (alt) {                                     // Alt：以起点为中心
    const hw = Math.abs(b.x - a.x), hh = Math.abs(b.y - a.y);
    x0 = a.x - hw; x1 = a.x + hw; y0 = a.y - hh; y1 = a.y + hh;
  }
  if (shift || tool === 'circle') {               // Shift / 圆：强制等比（正方形外框）
    const s = Math.max(x1 - x0, y1 - y0);
    const dx = (b.x >= a.x) ? 1 : -1, dy = (b.y >= a.y) ? 1 : -1;
    if (alt) {
      x0 = a.x - s / 2; x1 = a.x + s / 2; y0 = a.y - s / 2; y1 = a.y + s / 2;
    } else {
      const px = (dx > 0) ? x0 : x1, py = (dy > 0) ? y0 : y1;
      x0 = (dx > 0) ? px : px - s; x1 = (dx > 0) ? px + s : px;
      y0 = (dy > 0) ? py : py - s; y1 = (dy > 0) ? py + s : py;
    }
  }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const rx = Math.max(1, (x1 - x0) / 2), ry = Math.max(1, (y1 - y0) / 2);
  const L = Math.max(1, x1 - x0), H = Math.max(1, y1 - y0);

  switch (tool) {
    case 'line':
      return { paths: [sampleLine(a, shift ? constrain45(a, b) : b)], closed: false, kind: 'line' };
    case 'rect':
      return { paths: [[{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }]], closed: true, kind: 'rect' };
    case 'circle':
    case 'ellipse':
      return { paths: [ellipsePath(cx, cy, rx, ry)], closed: true, kind: tool };
    case 'roundrect':
      return { paths: [roundRectPath(x0, y0, x1, y1, Math.min(rx, ry) * 0.34)], closed: true, kind: 'roundrect' };
    case 'diamond':
      return { paths: [[{ x: cx, y: y0 }, { x: x1, y: cy }, { x: cx, y: y1 }, { x: x0, y: cy }]], closed: true, kind: 'diamond' };
    case 'trapezoid': {
      const k = L * 0.24;
      return { paths: [[{ x: x0 + k, y: y0 }, { x: x1 - k, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }]], closed: true, kind: 'trapezoid' };
    }
    case 'parallelogram': {
      const k = L * 0.26;
      return { paths: [[{ x: x0 + k, y: y0 }, { x: x1, y: y0 }, { x: x1 - k, y: y1 }, { x: x0, y: y1 }]], closed: true, kind: 'parallelogram' };
    }
    case 'cross':
      return { paths: [crossPath(x0, y0, x1, y1)], closed: true, kind: 'cross' };
    case 'crescent':
      return { paths: [fitToBox(crescentPath(cx, cy, rx, ry), x0, y0, x1, y1)], closed: true, kind: 'crescent' };
    case 'cloud':
      return { paths: [fitToBox(cloudPath(cx, cy, rx, ry), x0, y0, x1, y1)], closed: true, kind: 'cloud' };
    case 'semicircle': {
      const pts = [];
      const n2 = 64;
      for (let i = 0; i <= n2; i++) {
        const ang = Math.PI + Math.PI * (i / n2);
        pts.push({ x: cx + rx * Math.cos(ang), y: cy + ry * Math.sin(ang) });
      }
      return { paths: [pts], closed: true, kind: 'semicircle' };
    }
    case 'arc': {
      const pts = [];
      const n2 = 64;
      for (let i = 0; i <= n2; i++) {
        const ang = Math.PI * 0.75 + Math.PI * 1.5 * (i / n2);
        pts.push({ x: cx + rx * Math.cos(ang), y: cy + ry * Math.sin(ang) });
      }
      return { paths: [pts], closed: false, kind: 'arc' };
    }
    case 'wave': {
      const pts = [], n2 = 96;
      for (let i = 0; i <= n2; i++) {
        const t = i / n2;
        pts.push({ x: x0 + L * t, y: cy - ry * Math.sin(t * Math.PI * 2) });
      }
      return { paths: [pts], closed: false, kind: 'wave' };
    }
    case 'spiral': {
      const pts = [], n2 = 200, turns = 2.6;
      const rr = Math.min(rx, ry);
      for (let i = 0; i <= n2; i++) {
        const t = i / n2;
        const ang = t * turns * Math.PI * 2 - Math.PI / 2;
        const rad = rr * (0.10 + 0.90 * t);
        pts.push({ x: cx + rad * Math.cos(ang), y: cy + rad * Math.sin(ang) });
      }
      return { paths: [pts], closed: false, kind: 'spiral' };
    }
    case 'star6': return { paths: [starPath(cx, cy, rx, ry, 6, 0.56)], closed: true, kind: 'star6' };
    case 'triangle': return { paths: [polygonPath(cx, cy, rx, ry, 3)], closed: true, kind: 'triangle' };
    case 'pentagon': return { paths: [polygonPath(cx, cy, rx, ry, 5)], closed: true, kind: 'pentagon' };
    case 'hexagon': return { paths: [polygonPath(cx, cy, rx, ry, 6)], closed: true, kind: 'hexagon' };
    case 'star': return { paths: [starPath(cx, cy, rx, ry, 5)], closed: true, kind: 'star' };
    case 'heart': return { paths: [heartPath(cx, cy, rx, ry)], closed: true, kind: 'heart' };
    case 'arrow':
    case 'darrow': {
      const tip = shift ? constrain45(a, b) : b;
      const len = Math.hypot(tip.x - a.x, tip.y - a.y);
      if (len < 4) return null;
      const hl = Math.max(8, Math.min(60, len * 0.28)) * arrowSize;   // 末端大小可调
      const ang = Math.atan2(tip.y - a.y, tip.x - a.x);
      const half = 0.42;
      const headAt = (p, dir) => [
        { x: p.x - hl * Math.cos(dir - half), y: p.y - hl * Math.sin(dir - half) },
        { x: p.x, y: p.y },
        { x: p.x - hl * Math.cos(dir + half), y: p.y - hl * Math.sin(dir + half) }
      ];
      const paths = [sampleLine(a, tip, 12), headAt(tip, ang)];
      if (tool === 'darrow') paths.push(headAt(a, ang + Math.PI));
      return { paths, closed: false, kind: tool };
    }
  }
  return null;
}

// 对外入口：附加生成参数，便于之后按参数重建（如调整箭头末端大小）
function buildShape(tool, a, b, shift, alt) {
  const s = buildShapeRaw(tool, a, b, shift, alt);
  if (s) s.src = { tool, a: { x: a.x, y: a.y }, b: { x: b.x, y: b.y }, shift: !!shift, alt: !!alt };
  return s;
}

function shapeExtent(s) {
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  for (const path of s.paths) for (const p of path) {
    mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x);
    mny = Math.min(mny, p.y); mxy = Math.max(mxy, p.y);
  }
  return Math.max(mxx - mnx, mxy - mny);
}

// ---- 选中 / 编辑 ----
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy || 1;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t));
}
function shapeHit(s, p, tol = 11) {
  for (const path of s.paths) {
    for (let k = 1; k < path.length; k++) {
      if (segDist(p, path[k - 1], path[k]) <= tol) return true;
    }
    if (s.closed && path.length > 2 && segDist(p, path[path.length - 1], path[0]) <= tol) return true;
  }
  return false;
}
function hitShape(p) {
  for (let i = drawShapes.length - 1; i >= 0; i--) {
    if (shapeHit(drawShapes[i], p)) return drawShapes[i];
  }
  return null;
}

// ---- 选区包围盒与缩放手柄 ----
function selectionBBox() {
  if (!selectedShapes.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of selectedShapes) for (const path of s.paths) for (const q of path) {
    if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x;
    if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y;
  }
  if (!isFinite(x0)) return null;
  return { x0, y0, x1, y1 };
}
const HANDLE_PAD = 13;
function handleAt(p) {
  const bb = selectionBBox();
  if (!bb) return null;
  const spots = [['nw', bb.x0, bb.y0], ['ne', bb.x1, bb.y0], ['sw', bb.x0, bb.y1], ['se', bb.x1, bb.y1]];
  for (const [name, x, y] of spots) {
    if (Math.abs(p.x - x) <= HANDLE_PAD && Math.abs(p.y - y) <= HANDLE_PAD) return { name, x, y };
  }
  return null;
}

// ---- 图形级变换（同步维护 src，便于按参数重建箭头等） ----
function mapShape(s, f) {
  s.paths = s.paths.map(pa => pa.map(f));
  if (s.src) { s.src.a = f({ x: s.src.a.x, y: s.src.a.y }); s.src.b = f({ x: s.src.b.x, y: s.src.b.y }); }
}
function translateShape(s, dx, dy) { mapShape(s, q => ({ x: q.x + dx, y: q.y + dy })); }
function scaleShapeAbout(s, ax, ay, sx, sy) {
  mapShape(s, q => ({ x: ax + (q.x - ax) * sx, y: ay + (q.y - ay) * sy }));
}
function scaleSelection(sx, sy) {
  const bb = selectionBBox();
  if (!bb) return;
  pushHistory();
  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
  for (const s of selectedShapes) scaleShapeAbout(s, cx, cy, sx, sy);
  previewCache = [];
  updateDrawInfo();
}

// ---- 旋转（可指定旋转中心） ----
function currentPivot() {                      // 未自定义时用选区中心
  if (pivot) return pivot;
  const bb = selectionBBox();
  if (bb) return { x: (bb.x0 + bb.x1) / 2, y: (bb.y0 + bb.y1) / 2 };
  return { x: mainView.cx, y: mainView.cy };
}
function rotPt(q, pv, c, sn) {
  return {
    x: pv.x + (q.x - pv.x) * c - (q.y - pv.y) * sn,
    y: pv.y + (q.x - pv.x) * sn + (q.y - pv.y) * c
  };
}
function rotateShapeAbout(s, pv, ang) {
  const c = Math.cos(ang), sn = Math.sin(ang);
  mapShape(s, q => rotPt(q, pv, c, sn));
}
function rotateSelection(ang) {
  if (!selectedShapes.length) return;
  pushHistory();
  const pv = currentPivot();
  for (const s of selectedShapes) rotateShapeAbout(s, pv, ang);
  previewCache = [];
  updateDrawInfo();
}
function rotationHandles() {                   // 四角外侧的旋转手柄
  const bb = selectionBBox();
  if (!bb) return [];
  const off = 26;
  return [[bb.x0 - off, bb.y0 - off], [bb.x1 + off, bb.y0 - off],
          [bb.x0 - off, bb.y1 + off], [bb.x1 + off, bb.y1 + off]];
}
function rotHandleAt(p) {
  for (const [x, y] of rotationHandles()) {
    if (Math.hypot(p.x - x, p.y - y) <= 13) return { x, y };
  }
  return null;
}
function pivotHit(p) {                         // 旋转中心准星（可拖动）
  if (!selectedShapes.length) return false;
  const pv = currentPivot();
  return Math.hypot(p.x - pv.x, p.y - pv.y) <= 13;
}
function snapshotSelection() {
  return {
    pivot: currentPivot(),
    orig: selectedShapes.map(s => JSON.parse(JSON.stringify(s.paths))),
    origSrc: selectedShapes.map(s => (s.src ? JSON.parse(JSON.stringify(s.src)) : null))
  };
}
function applyRotationFrom(snap, ang) {
  const pv = snap.pivot, c = Math.cos(ang), sn = Math.sin(ang);
  const f = q => rotPt(q, pv, c, sn);
  selectedShapes.forEach((s, i) => {
    s.paths = snap.orig[i].map(pa => pa.map(f));
    const os = snap.origSrc[i];
    if (os) s.src = { tool: os.tool, shift: os.shift, alt: os.alt, a: f(os.a), b: f(os.b) };
  });
  previewCache = [];
  updateDrawInfo();
}

function pushHistory() {

}
function undoDraw() {

}

}

function duplicateSelected() {

  });

function mirrorSelected(dir) {                 // 复制并关于画布中线镜像

  const copies = selectedShapes.map(s => {

    return c;
  });

  updateDrawInfo();

function updateSelectedArrows() {              // 调整箭头末端大小时即时更新已选中的箭头
  let changed = false;
  for (const s of selectedShapes) {
    if (s.src && (s.src.tool === 'arrow' || s.src.tool === 'darrow')) {
      const rebuilt = buildShapeRaw(s.src.tool, s.src.a, s.src.b, s.src.shift, s.src.alt);
      if (rebuilt) {
        s.paths = rebuilt.paths;
        s.closed = rebuilt.closed;
        s.kind = rebuilt.kind;

function selectAll() {

}
function updateDrawInfo() {
  if (!drawing) { drawInfo.textContent = ''; return; }
  const n = drawShapes.length, m = selectedShapes.length;
  let txt = `${n} 个图形${m ? ` · 已选中 ${m}` : ''}${currentTool === 'eraser' ? ' · 橡皮擦' : ''}`;
  if (m) {

// ---- 橡皮擦：把线段在半径内的点挖掉，剩余部分拆成若干开放片段 ----
function segDist2(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy || 1;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  const ex = p.x - (a.x + dx * t), ey = p.y - (a.y + dy * t);
  return ex * ex + ey * ey;
}
function densify(path, step, closed) {
  const pts = closed ? path.concat([path[0]]) : path;
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.ceil(d / step));
    for (let k = 0; k < n; k++) {
      out.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
    }
  }
  if (!closed) out.push({ x: pts[pts.length - 1].x, y: pts[pts.length - 1].y });
  return out;
}
function runLength(run) {
  let len = 0;
  for (let i = 1; i < run.length; i++) len += Math.hypot(run[i].x - run[i - 1].x, run[i].y - run[i - 1].y);
  return len;
}
function eraseSegment(a, b, radius) {
  if (!a || !b) return false;
  const r2 = radius * radius;
  let changed = false;
  const kept = [];
  for (const s of drawShapes) {
    const newPaths = [];
    let shapeChanged = false;
    for (const path of s.paths) {
      if (path.length < 2) continue;
      const dense = densify(path, 3, s.closed);
      const n = dense.length;
      let anyHit = false;
      const alive = new Array(n);
      for (let i = 0; i < n; i++) {
        const hit = segDist2(dense[i], a, b) <= r2;
        alive[i] = !hit;
        if (hit) anyHit = true;
      }
      if (!anyHit) { newPaths.push(path); continue; }
      shapeChanged = true;
      let runs = [];
      if (s.closed) {
        // 环形：从第一个被擦除的点之后开始，绕一圈收集连续片段
        let start = -1;
        for (let i = 0; i < n; i++) if (!alive[i]) { start = i; break; }
        if (start < 0) { newPaths.push(path); continue; }
        let cur = [];
        for (let k = 0; k < n; k++) {
          const i = (start + 1 + k) % n;
          if (alive[i]) cur.push(dense[i]);
          else if (cur.length) { runs.push(cur); cur = []; }
        }
        if (cur.length) runs.push(cur);
      } else {
        let cur = [];
        for (let i = 0; i < n; i++) {
          if (alive[i]) cur.push(dense[i]);
          else if (cur.length) { runs.push(cur); cur = []; }
        }
        if (cur.length) runs.push(cur);
      }
      for (const run of runs) {
        if (run.length >= 2 && runLength(run) >= 6) newPaths.push(run);
      }
    }
    if (shapeChanged) changed = true;
    s.paths = newPaths;
    if (shapeChanged) s.closed = false;              // 被擦断后按开放笔画处理
    if (newPaths.length) kept.push(s);
  }
  if (changed) {
    drawShapes = kept;
    selectedShapes = [];
    previewCache = [];
  }

}

// 把任意坐标系的路径缩放到画布中央（与动画中的显示尺寸一致）
function pathsToCanvas(paths) {
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  for (const pa of paths) for (const p of pa) {
    mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x);
    mny = Math.min(mny, p.y); mxy = Math.max(mxy, p.y);
  }
  const s = Math.max(mxx - mnx, mxy - mny) || 1;
  const scale = (Math.min(W, H) * 0.60) / s;         // 动画里图形占短边的 60%
  const ox = (mnx + mxx) / 2, oy = (mny + mxy) / 2;
  return paths.map(pa => pa.map(p => ({
    x: (p.x - ox) * scale + W / 2,
    y: (p.y - oy) * scale + H / 2
  })));
}
function syncToolButtons() {

function autoClosed(pts) {                     // 首尾接近则视为闭合图形
  const a = pts[0], b = pts[pts.length - 1];
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  for (const p of pts) {
    mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x);
    mny = Math.min(mny, p.y); mxy = Math.max(mxy, p.y);
  }
  const diag = Math.hypot(mxx - mnx, mxy - mny);
  return Math.hypot(a.x - b.x, a.y - b.y) < Math.max(24, diag * 0.22);

canvas.addEventListener('pointerdown', (e) => {
  if (e.button === 1 || spaceDown) {             // 中键 / 空格 = 平移视图
    panState = { x: e.offsetX, y: e.offsetY, px: viewPanX, py: viewPanY };
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (!drawing) return;
  const raw = screenToBase({ x: e.offsetX, y: e.offsetY });
  canvas.setPointerCapture(e.pointerId);

  // 1) 旋转手柄 → 旋转中心 → 缩放手柄（优先级从高到低）
  const rh = rotHandleAt(raw);
  if (rh && selectedShapes.length) {
    pushHistory();
    const snap = snapshotSelection();
    dragState = {
      mode: 'rotate', snap, ang: 0,
      a0: Math.atan2(raw.y - snap.pivot.y, raw.x - snap.pivot.x)

    return;
  }
  if (currentTool === 'select' && pivotHit(raw)) {      // 拖动准星指定旋转中心
    pushHistory();
    pivot = (snapGrid && !e.altKey) ? snapPt(raw) : { x: raw.x, y: raw.y };
    dragState = { mode: 'pivot' };
    updateDrawInfo();
    return;
  }
  const h = handleAt(raw);
  if (h && selectedShapes.length) {
    pushHistory();
    const bb = selectionBBox();
    const anchor = e.altKey
      ? { x: (bb.x0 + bb.x1) / 2, y: (bb.y0 + bb.y1) / 2 }
      : { x: h.name.indexOf('w') >= 0 ? bb.x1 : bb.x0, y: h.name.indexOf('n') >= 0 ? bb.y1 : bb.y0 };
    dragState = {
      mode: 'scale', anchor, corner: { x: h.x, y: h.y }, sx: 1, sy: 1,
      orig: selectedShapes.map(s => JSON.parse(JSON.stringify(s.paths))),
      origSrc: selectedShapes.map(s => (s.src ? JSON.parse(JSON.stringify(s.src)) : null))
    };
    return;
  }

  if (currentTool === 'eraser') {
    pushHistory();
    eraserPos = raw;
    dragState = { mode: 'erase', last: raw };
    eraseSegment(raw, raw, eraserSize);
    return;
  }
  if (currentTool === 'select') {
    const hit = hitShape(raw);
    const multi = e.shiftKey || e.ctrlKey || e.metaKey;
    if (hit) {
      if (multi) {
        const i = selectedShapes.indexOf(hit);
        if (i >= 0) selectedShapes.splice(i, 1); else selectedShapes.push(hit);
      } else if (selectedShapes.indexOf(hit) < 0) {
        selectedShapes = [hit];
        pivot = null;                              // 换了选区 → 旋转中心回到选区中心
      }
    } else if (!multi) {
      selectedShapes = [];
      pivot = null;
    }
    dragState = (hit && selectedShapes.length)
      ? {
        mode: 'move', start: raw, moved: false,
        orig: selectedShapes.map(s => JSON.parse(JSON.stringify(s.paths))),
        origSrc: selectedShapes.map(s => (s.src ? JSON.parse(JSON.stringify(s.src)) : null))
      }
      : null;
    updateDrawInfo();
    return;
  }
  // 2) 任何绘制工具下，按在「已选中」的图形上都能直接拖动它
  if (selectedShapes.length) {
    for (let i = selectedShapes.length - 1; i >= 0; i--) {
      if (shapeHit(selectedShapes[i], raw)) {
        dragState = {
          mode: 'move', start: raw, moved: false,
          orig: selectedShapes.map(s => JSON.parse(JSON.stringify(s.paths))),
          origSrc: selectedShapes.map(s => (s.src ? JSON.parse(JSON.stringify(s.src)) : null))
        };
        return;
      }
    }
  }
  if (currentTool === 'free') {
    freehand = [raw];
    dragState = { mode: 'free' };
    return;
  }
  const p = snapPt(raw);
  dragState = { mode: 'create', a: p, b: p, shift: e.shiftKey, alt: e.altKey };
});
canvas.addEventListener('pointerleave', () => { eraserPos = null; });
canvas.addEventListener('pointermove', (e) => {
  if (panState) {                                 // 平移视图
    viewPanX = panState.px + (e.offsetX - panState.x);
    viewPanY = panState.py + (e.offsetY - panState.y);
    return;
  }
  if (!drawing) return;
  const raw = screenToBase({ x: e.offsetX, y: e.offsetY });
  if (currentTool === 'eraser') eraserPos = raw;
  if (!dragState) return;

  if (dragState.mode === 'rotate') {                  // 拖手柄旋转
    const pv = dragState.snap.pivot;
    let ang = Math.atan2(raw.y - pv.y, raw.x - pv.x) - dragState.a0;
    if (e.shiftKey) {                                 // 吸附到 15° 整数倍
      const step = Math.PI / 12;
      ang = Math.round(ang / step) * step;
    }
    dragState.ang = ang;
    applyRotationFrom(dragState.snap, ang);
    return;
  }
  if (dragState.mode === 'pivot') {                   // 拖准星指定旋转中心
    pivot = (snapGrid && !e.altKey) ? snapPt(raw) : { x: raw.x, y: raw.y };
    updateDrawInfo();
    return;
  }
  if (dragState.mode === 'scale') {
    const p = (snapGrid && !e.altKey) ? snapPt(raw) : raw;
    const { anchor, corner } = dragState;
    let sx = (corner.x - anchor.x) !== 0 ? (p.x - anchor.x) / (corner.x - anchor.x) : 1;
    let sy = (corner.y - anchor.y) !== 0 ? (p.y - anchor.y) / (corner.y - anchor.y) : 1;
    if (e.shiftKey) {
      const k = Math.max(Math.abs(sx), Math.abs(sy));
      sx = (sx < 0 ? -k : k); sy = (sy < 0 ? -k : k);
    }
    sx = Math.max(0.02, Math.min(40, sx));
    sy = Math.max(0.02, Math.min(40, sy));
    dragState.sx = sx; dragState.sy = sy;
    const f = q => ({ x: anchor.x + (q.x - anchor.x) * sx, y: anchor.y + (q.y - anchor.y) * sy });
    selectedShapes.forEach((s, i) => {
      s.paths = dragState.orig[i].map(pa => pa.map(f));
      const os = dragState.origSrc[i];
      if (os) s.src = { tool: os.tool, shift: os.shift, alt: os.alt, a: f(os.a), b: f(os.b) };
    });
    previewCache = [];
    return;
  }
  if (dragState.mode === 'erase') {
    eraseSegment(dragState.last, raw, eraserSize);
    dragState.last = raw;
    return;
  }
  if (dragState.mode === 'free') {
    const last = freehand[freehand.length - 1];
    if (Math.hypot(raw.x - last.x, raw.y - last.y) > 2) freehand.push(raw);
    return;
  }
  if (dragState.mode === 'create') {
    dragState.b = snapPt(raw);
    dragState.shift = e.shiftKey;
    dragState.alt = e.altKey;
    return;
  }
  if (dragState.mode === 'move' && selectedShapes.length) {
    if (!dragState.moved) { pushHistory(); dragState.moved = true; }
    let dx = raw.x - dragState.start.x, dy = raw.y - dragState.start.y;
    if (snapGrid && !e.altKey) { dx = Math.round(dx / GRID) * GRID; dy = Math.round(dy / GRID) * GRID; }
    selectedShapes.forEach((s, i) => {
      s.paths = dragState.orig[i].map(pa => pa.map(q => ({ x: q.x + dx, y: q.y + dy })));
      const os = dragState.origSrc[i];
      if (os) {
        s.src = {
          tool: os.tool, shift: os.shift, alt: os.alt,
          a: { x: os.a.x + dx, y: os.a.y + dy }, b: { x: os.b.x + dx, y: os.b.y + dy }
        };
      }
    });
    previewCache = [];
  }
});
canvas.addEventListener('pointerup', () => {
  if (panState) { panState = null; return; }
  if (!drawing || !dragState) return;
  const st = dragState;
  dragState = null;
  if (st.mode === 'erase') { updateDrawInfo(); return; }
  if (st.mode === 'scale' || st.mode === 'rotate' || st.mode === 'pivot') { updateDrawInfo(); return; }
  if (st.mode === 'free') {
    if (freehand.length >= 3) {
      pushHistory();
      const s = { paths: [freehand.slice()], closed: autoClosed(freehand), kind: 'free' };
      drawShapes.push(s);
      selectedShapes = [s];
      previewCache = [];
    }
    freehand = [];
    updateDrawInfo();
    return;
  }
  if (st.mode === 'create') {
    const built = buildShape(currentTool, st.a, st.b, st.shift, st.alt);
    if (built && shapeExtent(built) > 6) {
      pushHistory();
      drawShapes.push(built);
      selectedShapes = [built];
      previewCache = [];
    }
    updateDrawInfo();
  }
});

    e.preventDefault();
    if (drawing) { spaceDown = true; return; }
    playing = !playing; updatePlayBtn();
    return;
  }
  if (e.ctrlKey && e.code === 'Digit0') { e.preventDefault(); resetView(); return; }
  if (drawing) {                                   // 绘图模式的快捷键
    if (e.code === 'Delete' || e.code === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
    if (e.code === 'Escape') { selectedShapes = []; updateDrawInfo(); return; }
    if (e.ctrlKey && e.code === 'KeyA') { e.preventDefault(); selectAll(); return; }
    if (e.ctrlKey && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redoDraw() : undoDraw(); return; }
    if (e.ctrlKey && e.code === 'KeyY') { e.preventDefault(); redoDraw(); return; }
    if (e.ctrlKey && e.code === 'KeyD') { e.preventDefault(); duplicateSelected(); return; }
    if (e.code.indexOf('Arrow') === 0) {
      const step = e.shiftKey ? 10 : 1;
      const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.code];
      if (d && selectedShapes.length) { e.preventDefault(); nudgeSelected(d[0], d[1]); }
      return;
    }
    if (e.code === 'Equal' || e.code === 'NumpadAdd' || e.code === 'Minus' || e.code === 'NumpadSubtract') {
      if (!selectedShapes.length) return;
      e.preventDefault();
      const f = (e.code === 'Minus' || e.code === 'NumpadSubtract') ? 0.9 : 1.1;
      scaleSelection(f, f);
      return;
    }
    if (e.code === 'BracketLeft' || e.code === 'BracketRight') {   // [ / ] 旋转
      if (!selectedShapes.length) return;
      e.preventDefault();
      const step = (e.shiftKey ? 5 : 15) * Math.PI / 180;
      rotateSelection(e.code === 'BracketLeft' ? -step : step);
      return;
    }
    return;
  }
  if (e.code === 'Escape' && focusMode) {
    focusMode = false;
    document.body.classList.remove('focus');
    document.getElementById('btnFocus').textContent = '⛶ 专注';
    resize();
    return;
  }
});

  const img = new Image();

  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('无法读取图片')); img.src = url; });
